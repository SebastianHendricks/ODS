<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find a Barber</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map { height: 400px; width: 100%; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>Nearby Barbers</h1>
  <p>Allow location access to find barbers near you. Click a marker to call.</p>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const barbers = [
      { name: 'Downtown Cuts', phone: 'tel:+1234567890', lat: -33.912, lng: 18.414 },
      { name: 'City Barber', phone: 'tel:+1987654321', lat: -33.915, lng: 18.418 },
      { name: 'Neighborhood Trim', phone: 'tel:+1123456789', lat: -33.918, lng: 18.410 }
    ];

    const map = L.map('map').setView([-33.915, 18.414], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function addBarberMarkers() {
      barbers.forEach(barber => {
        L.marker([barber.lat, barber.lng]).addTo(map)
          .bindPopup(`<b>${barber.name}</b><br><a href="${barber.phone}">Call</a>`);
      });
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const userCoords = [pos.coords.latitude, pos.coords.longitude];
        map.setView(userCoords, 14);
        L.marker(userCoords).addTo(map).bindPopup('You are here').openPopup();
        addBarberMarkers();
      }, () => {
        addBarberMarkers();
      });
    } else {
      addBarberMarkers();
    }
  </script>
</body>
</html>
